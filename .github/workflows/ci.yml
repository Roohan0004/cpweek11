name: ci-wf
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
jobs:
  linting-job:
    runs-on: ubuntu-latest
    steps:
      - name: welcome step
        run: echo "welcome to Linting" 
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: install HTMLHINT
        run: npm install --save-dev htmlhint
      - name: Lint HTML
        run: npx htmlhint "**/*.html"
        